name: Release

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image version tag (e.g. 1.2-1); leave empty to use the default from the Dockerfile"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and image tags
        id: meta
        run: |
          version="${{ inputs.image_version }}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^ARG IMAGE_VERSION=//p' Dockerfile | tr -d '\r')
          fi
          if [ -z "$version" ]; then
            echo "Could not determine IMAGE_VERSION" >&2
            exit 1
          fi
          # Image heißt "tinyows", unabhängig vom Repository-Namen
          # (das Repo hieß historisch mapserver-tinyows).
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tinyows"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
